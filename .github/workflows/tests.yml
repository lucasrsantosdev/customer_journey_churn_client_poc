name: Validacao POC Sintetica
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduzir fontes e pipeline
        run: python -m src.main --all
      - name: Testes de regras e integracao
        run: python -m unittest discover -s tests -v
